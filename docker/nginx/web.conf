# Storefront: static files, with /api and /uploads forwarded to the API.
# HTTPS is handled in front of this container (Caddy in docker-compose.prod.yml).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # Admin video uploads are up to 50 MB.
  client_max_body_size 1m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # Real client address as seen by the edge proxy, passed on to the API's rate limits.
  set_real_ip_from 0.0.0.0/0;
  real_ip_header X-Forwarded-For;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s;
  }

  location /uploads/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
  }

  location = /robots.txt { proxy_pass http://api:4000; }
  location = /sitemap.xml { proxy_pass http://api:4000; }

  # Hashed file names: cache for a year.
  location /assets/ {
    include /etc/nginx/snippets/security.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Single-page app: unknown paths get index.html, which must never be cached.
  location / {
    include /etc/nginx/snippets/security.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}

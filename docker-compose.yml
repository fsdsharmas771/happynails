# Development stack. Start with `docker compose up` (or `pnpm run up` from a host with pnpm).

x-node: &node
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
  image: happynails-dev:latest
  working_dir: /app
  volumes:
    - .:/app
    # Every workspace gets its own node_modules volume so pnpm's symlinks
    # never land on the Windows/macOS bind mount.
    - node_modules:/app/node_modules
    - node_modules_api:/app/apps/api/node_modules
    - node_modules_web:/app/apps/web/node_modules
    - node_modules_admin:/app/apps/admin/node_modules
    - node_modules_shared:/app/packages/shared/node_modules
    - node_modules_ui:/app/packages/ui/node_modules
  env_file:
    - path: .env
      required: false
  environment:
    # Bind-mounted files do not emit inotify events on Docker Desktop, so watchers poll.
    CHOKIDAR_USEPOLLING: "true"
    WATCH_POLL: "true"

services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Initiates the single-node replica set on first run, then reports its status.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  # One-shot: installs dependencies once so api/web/admin do not race on the shared store.
  install:
    <<: *node
    command: ["pnpm", "install", "--frozen-lockfile=false"]
    restart: "no"

  api:
    <<: *node
    command: ["pnpm", "--filter", "@happynails/api", "dev"]
    ports:
      - "${API_HOST_PORT:-4000}:4000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCH_POLL: "true"
      NODE_ENV: development
      PORT: "4000"
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/happynails?replicaSet=rs0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:5174}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      install:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    <<: *node
    command: ["pnpm", "--filter", "@happynails/web", "dev"]
    ports:
      - "${WEB_HOST_PORT:-5173}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCH_POLL: "true"
      API_PROXY_TARGET: http://api:4000
    depends_on:
      install:
        condition: service_completed_successfully

  admin:
    <<: *node
    command: ["pnpm", "--filter", "@happynails/admin", "dev"]
    ports:
      - "${ADMIN_HOST_PORT:-5174}:5174"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCH_POLL: "true"
      API_PROXY_TARGET: http://api:4000
    depends_on:
      install:
        condition: service_completed_successfully

  # Opt-in public HTTPS tunnel to the API so Razorpay can deliver webhooks in development.
  # Start with: docker compose --profile tunnel up -d tunnel, then read the URL from its logs.
  # Exposes the whole API while running; stop it when you are done testing payments.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:4000"]
    profiles: ["tunnel"]
    depends_on:
      - api

  # Browser tests (Playwright) against the dev servers: pnpm e2e
  # Creates real test orders and bookings, then cancels them through the admin API.
  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: ["e2e"]
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e
      - node_modules_e2e:/e2e/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      E2E_WEB_URL: http://web:5173
      E2E_ADMIN_URL: http://admin:5174
    command: ["sh", "-c", "npm ci --no-audit --no-fund --loglevel=error && npx playwright test"]
    depends_on:
      - web
      - admin

volumes:
  node_modules_e2e:
  mongo_data:
  redis_data:
  node_modules:
  node_modules_api:
  node_modules_web:
  node_modules_admin:
  node_modules_shared:
  node_modules_ui:
